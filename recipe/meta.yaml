{% set name = "compas_timber" %}
{% set version = "3.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/compas_timber-{{ version }}.tar.gz
  sha256: bdd8cc84dfc5275d1a7ed29629fd5c1c07c090b8e560644dd807aafab02c001d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
  run:
    - python >={{ python_min }}
    - rtree
    - compas >=2.15.1,<3
    - compas_model ==0.9.2
    - scipy >=1.1
    - compas-brep >=0.4.2
    - compas_pb >=1.2.0,<2

test:
  imports:
    - compas_timber
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/gramaziokohler/compas_timber
  summary: COMPAS package for modeling, designing and fabricating timber assemblies.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - chenkasirer
    - gonzalocasas
